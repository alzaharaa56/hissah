spring.application.name=hissah
server.port=${SERVER_PORT:8080}

# MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/hissah_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Muscat}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA - Flyway owns the schema; Hibernate checks that mappings match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Muscat

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=true

# Uploads
app.file-storage.upload-dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:5MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:25MB}

# Demo seeding is disabled unless the dev profile explicitly enables it.
app.seed.enabled=${APP_SEED_ENABLED:false}

# JWT Authentication
# 24 hours = 86400000 milliseconds
# ===============================
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Frontend CORS Origins
# ===============================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500,http://localhost:8080}

# JSON serialization
# Spring Boot 4 / Jackson 3 defaults are used.

# Temporary first-administrator bootstrap
app.admin-bootstrap.enabled=${ADMIN_BOOTSTRAP_ENABLED:true}
app.admin-bootstrap.key=${ADMIN_SETUP_KEY:ChangeThisSetupKeyBeforeRunning}

# ============================================================
# Hissah AI features
# Keep the real key outside GitHub and load it from the backend environment.
# ============================================================
app.ai.enabled=${AI_ENABLED:false}
app.ai.mock-enabled=${AI_MOCK_ENABLED:true}
app.ai.base-url=${OPENAI_BASE_URL:https://api.openai.com}
app.ai.api-key=${OPENAI_API_KEY:}
app.ai.model=${OPENAI_MODEL:gpt-5.6}
app.ai.max-output-tokens=${AI_MAX_OUTPUT_TOKENS:1200}
app.ai.matching-candidate-limit=${AI_MATCHING_CANDIDATE_LIMIT:8}


